; UEFI Boot Animation Agent 配置示例
; 放置于 ESP 的 \EFI\BootAnim\config.ini（缺省各键均有兜底值）
;
; Resolution : auto | WxH（如 1920x1080 / 2560x1440 / 3840x2160）
;              建议与 anim.bin 打包分辨率及显示器原生分辨率一致
; Fps        : 1..120（24/30/60/120 为标准档）；缺省回落 anim.bin 的 fps_hint
; AnimPath   : 相对 \EFI\BootAnim\ 的动画包文件名
; SkipKey    : EFI 扫描码（0x1b 将被映射为 ESC 扫描码 0x0017）或 0xFFFF=任意键
;              回车/换行恒视为跳过；Esc 两种形态（ScanCode/Unicode）恒可跳过
; Chainload  : 动画结束后链式加载的目标，必须是绝对路径
[anim]
Resolution = 1920x1080
Fps        = 24
AnimPath   = anim.bin
SkipKey    = 0x1b
Chainload  = \EFI\Microsoft\Boot\bootmgfw.efi
